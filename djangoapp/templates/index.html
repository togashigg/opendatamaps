<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<!-- Copyright (C) N.Togashi 2023 -->
	<!-- opendatamaps 0.0.1 -->
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
	<title>オープンデータ on Google Maps</title>
	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
	<script type="text/javascript" src="https://code.jquery.com/ui/1.12.0/jquery-ui.min.js"></script>
	<link rel="stylesheet" href="http://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
	<link type="text/css" rel="stylesheet" href="static/css/opendatamaps.css"></style>
	<script>
		(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
		key: atob("{{ GOOGLE_MAPS_API_KEY }}"),
		v: "weekly",
		// Use the 'v' parameter to indicate the version to use (weekly, beta, alpha, etc.).
		// Add other bootstrap parameters as needed, using camel case.
		});
		google.maps.importLibrary("maps");
		google.maps.importLibrary("marker");
	</script>
	<script type="text/javascript" src="static/js/opendatamaps.js"></script>
</head>
<body onLoad="onLoad(); resizeWindows();" onResize="resizeWindows();" bgcolor="#F0F0F0">
	<div id="title"><center><a href="https://www.digital.go.jp/resources/open_data/" name="オープンデータ">オープンデータ</a> on <a href="https://mapsplatform.google.com/?hl=ja" name="Google Maps">Google Maps</a></center></div>
	<form name="selectForm">
		<div id="main">
			<fieldset bgcolor="#A0A0A0">
				<div bgcolor="#808080">
					<div id="operationMenu"></div>
				</div>
				<div>
					<table border="0">
						<tr>
							<td valign="top"><div id="gmap"></div></td>
							<td valign="top"><div id="markTableH"></div></td>
						</tr>
						<tr>
							<td colspan="2"><div id="markTableV"></div></td>
						</tr>
					</table>
				</div>
				<div id="message">
				</div>
			</fieldset>
		</div>
		<div id="modalDetail">
			<div id="popupDetail" class="modalWindow">
				<table border="0" class="modalTitle">
					<tr>
						<th width="80%">詳細情報</th>
						<th width="20%" align="right" nowrap>
							<input type="button" value="✖" onClick="closeDetail();" />
						</th>
					</tr>
				</table>
				<div id="detailsTabArea">
					<ul class="scrollable-tabs" id="detailsTabs">
						<li><a href="#detailsTab_1">1</a></li>
					</ul>
					<div id="detailsTab_1">
						<div id="locationDetail"></div>
					</div>
				</div>
				<div>
					<center>
						<input type="button" value="クローズ" onClick="closeDetail();" />
					</center>
				</div>
			</div>
		</div>
		<div id="modalSettings">
			<div id="popupSettings" class="modalWindow">
				<table border="0" class="modalTitle" width="100%">
					<tr><th width="80%">設定</th>
						<th width="20%" align="right" nowrap>
							<input type="button" value="✖" onClick="closeSettings();" />
						</th>
					</tr>
				</table>
				<div id="settingsTabArea" style="width:95%">
					<ul>
						<li><a href="#settingsTab1">基本</a></li>
						<li><a href="#settingsTab2">近隣施設</a></li>
						<li><a href="#settingsTab3">市区町村施設</a></li>
					</ul>
					<div id="settingsTab1">
						<table border="1" width="100%">
							<tr><th nowrap>項目</th><th nowrap>設定値</th></tr>
							<tr><td>動作モード</td><td id="mode">
								<label><input name="mode" id="mode_center" type="radio" value="center" onClick="selectMode(this.value);" />近隣施設</label>
								<label><input name="mode" id="mode_code" type="radio" value="code" onClick="selectMode(this.value);" />市区町村施設</label>
							</td></tr>
							<tr><td>種別</td><td id="kindListSelect"></td></tr>
							<tr><td>種別<BR>（除外）</td><td id="notKindListSelect"></td></tr>
						</table>
					</div>
					<div id="settingsTab2">
						<table border="1" width="100%">
							<tr><td nowrap>近隣距離</td><td id="nearDistamce" nowrap>
								<select id="selectDistanceList" name="selectDistanceList" onChange="selectDistance(this.options[this.selectedIndex].value);" style="text-align: right;">
									<option value="500">500m</option>
									<option value="1000">1,000m</option>
									<option value="2000">2,000m</option>
									<option value="5000">5,000m</option>
								</select>
							</td></tr>
						</table>
					</div>
					<div id="settingsTab3">
						<table border="1" width="100%">
							<tr><td nowrap>市区町村名</td>
								<td id="localityData" nowrap></td>
							</tr>
						</table>
					</div>
				</div>
				<div>
					<center>
						<input type="button" value="クローズ" onClick="closeSettings();" />&nbsp;&nbsp;&nbsp;
						<input type="button" value="データ更新" onClick="updateMapsData(); closeSettings();" />
					</center>
				</div>
			</div>
		</div>
	</form>
	<input type="hidden" id="GoogleMapsApiKey" value="{{ GOOGLE_MAPS_API_KEY }}" />
</body>
</html>
