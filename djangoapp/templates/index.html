	// Google Maps APIのcallback関数
	function initMap() {
		if(DEBUG) console.log(dateToString(new Date())+' initMap() start');
		// 位置情報対応ブラウザの確認
		if(!navigator.geolocation) {
			myGeolocation=false;
		}
		// マップ表示・表表示
		mapCenter=new google.maps.LatLng(initialLatlng.lat, initialLatlng.lng);
		var gmapTag=document.getElementById("gmap");
		var options={
			zoom: 15,
			center: mapCenter,
			mapTypeId: google.maps.MapTypeId.ROADMAP,
			scaleControl:true
		};
		map=new google.maps.Map(gmapTag, options);
		startTraceCurrentPosition();
		// resizeWindows();
		showDataList();
		if(paramLocality>0 && paramID>0) {
			readData(paramID);
		}
		showTable();
		if(DEBUG) console.log(dateToString(new Date())+' initMap() ended');
	}

		selectTags+='<option value="0" '+selected+'>0:(未選択)</option>\n';

			// selectTags+='<option value="'+(i+1)+'"'+selected+'>'+(i+1)+':'+dataList[i]['title']+'／公開日：'+dataList[i]['date']+'</option>\n';

	// 自治体選択
	function selectLocality(localityIndex) {
		if(DEBUG) console.log(dateToString(new Date())
				+' selectLocality() start, dataIndex='+dataIndex);
		if(locality_list.length<1) {
			return;
		}
		if(typeof localityIndex=='undefined' || isNaN(localityIndex)) {
			return;
		}
		paramLocality=localityIndex;
		dataList=[]
		if(paramLocality>0) {
			dataList=locality_list[paramLocality-1].datalist
		}
		paramID=0;
		showDataList();
		selectId(paramId);
		if(DEBUG) console.log(dateToString(new Date())+' selectLocality() ended');
		return false;
	}
	// データセット選択
	function selectId(dataIndex) {
		if(DEBUG) console.log(dateToString(new Date())
				+' selectId() start, dataIndex='+dataIndex);
		if(dataList.length<1) {
			return;
		}
		if(typeof dataIndex=='undefined' || isNaN(dataIndex)) {
			return;
		}
		paramID=dataIndex;
		readData(dataIndex);
		delMarkers=true;
		// 表更新
		showTable();
		// マーカー表示
		showMarkers();
		if(DEBUG) console.log(dateToString(new Date())+' selectId() ended');
	}
	// データファイル読み込み
	function readData(dataIndex) {
		if(DEBUG) console.log(dateToString(new Date())
				+' readData() start, dataIndex='+dataIndex);
		data=[];
		dataIndex--;
		var httpObj=new XMLHttpRequest();
		var readText='';
		var url=dataList[dataIndex].cache;
		httpObj.open("GET", url, true);
		httpObj.onreadystatechange=function() {
			if (httpObj.readyState==4) {
				if(httpObj.status==200) {
					if(DEBUG) console.log(dateToString(new Date())+' OK HTTP response.');
					readText+=httpObj.responseText;
					data=[];
					if(dataList[dataIndex].format.type=='TSV') {
						if(readText.match(/\r/)) {
							readText=readText.split('\r\n');
						} else {
							readText=readText.split('\n');
						}
						data=dataFromTsv(readText, dataIndex);
					} else if(dataList[dataIndex].format.type=='CSV') {
						data=dataFromCsv(readText, dataIndex);
					} else if(dataList[dataIndex].format.type=='JSON') {
						data=dataFromJson(readText, dataIndex);
					} else {
						console.log('\u001b[31m'+"error in dataInfo.format.type, "+JSON.stringify(dataList[dataIndex])+'\u001b[0m');
					}
					delMarkers=true;
					// 表更新
					showTable();
					// マーカー表示
					showMarkers();
				} else {
					alert('データファイルの読み込みに失敗.\n'+url+'\nstatus='+httpObj.status+')。');
				}
			}
		}
		httpObj.overrideMimeType("text/plain; charset=UTF-8");
		httpObj.send(null);
		if(DEBUG) console.log(dateToString(new Date())+' readData() ended');
		return false;
	}
	function dataFromTsv(readText, dataInfoIndex) {
		let data=[];
		let headers=[];
		let no=0;
		for(i=0; i<readText.length; i++) {
			if(readText[i].length==0) {
				continue;
			}
			if(readText[i].substr(0,1)=='#') {
				if(readText[i].substr(0,10)=='#property\t') {
					headers=readText[i].split('\t');
					for(j=0; j<headers.length; j++) {
						var hd=headers[j].split('/');
						if(hd.length>1) {
							headers[j]=hd[hd.length-1];
						}
					}
				}
				continue;
			}
			let tsv=readText[i].split('\t');
			let infos='';
			let reg=new RegExp("((https?|ftp)(:\/\/[-_.!~*\'()a-zA-Z0-9;\/?:\@&=+\$,%#]+))", 'g');
			dataList[dataInfoIndex].info.forEach(function(no) {
				if(infos!='') {
					infos+='<BR>';
				}
				var text=tsv[no].replace(reg, function(match) {
					return "<a href='" + match + "' target='_blank'>" + match + "</a>";
				});
				infos+=headers[no]+'：'+text;
			});
			no+=1;
			data.push({
				no:no,
				id:tsv[dataList[dataInfoIndex].id],
				label:tsv[dataList[dataInfoIndex].label],
				info:infos,
				lng:tsv[dataList[dataInfoIndex].lng],
				lat:tsv[dataList[dataInfoIndex].lat],
			});
		}
		return data;
	}
	function dataFromCsv(readText, dataInfoIndex) {
		let data=[];
		let headers=[];
		let no=0;
		// JavaScriptでダブルクォーテーションを含むCSVを配列に変換する // https://zenn.dev/itte/articles/516228940932a5
		let csv=readText;
		const parseCsv = csv => csv.replace(/\r/g, '').split('\n').reduce(([data, isInQuotes], line) => {
			const [datum, newIsInQuotes] = ((isInQuotes ? '"' : '') + line).split(',').reduce(([datum, isInQuotes], text) => {
				const match = isInQuotes || text.match(/^(\"?)((.*?)(\"*))$/)
				if (isInQuotes) datum[datum.length - 1] += ',' + text.replace(/\"+/g, m => '"'.repeat(m.length / 2))
				else datum.push(match[1] ? match[2].replace(/\"+/g, m => '"'.repeat(m.length / 2)) : match[2])
				return [datum, isInQuotes ? !(text.match(/\"*$/)[0].length % 2) : match[1] && !(match[4].length % 2)]
			}, [[]])
			if (isInQuotes) data[data.length - 1].push(data[data.length - 1].pop() + '\n' + datum[0], ...datum.slice(1))
			else data.push(datum)
			return [data, newIsInQuotes]
		}, [[]])[0]
		let csvArray=parseCsv(csv);
		let reg=new RegExp("((https?|ftp)(:\/\/[-_.!~*\'()a-zA-Z0-9;\/?:\@&=+\$,%#]+))", 'g');
		for(i=0; i<csvArray.length; i++) {
			if(csvArray[i][0]=='' || csvArray[i][0].substr(0,1)=='#') {
				continue;
			}
			if(i<dataList[dataInfoIndex].format.header) {
				headers=csvArray[i];
				continue;
			}
			if(csvArray[i][dataList[dataInfoIndex].label]=='') {
				continue;
			}
			let infos='';
			dataList[dataInfoIndex].info.forEach(function(no) {
				if(no<csvArray[i].length) {
					if(infos!='') {
						infos+='<BR>';
					}
					if(csvArray[i][no]!='') {
						let text=csvArray[i][no].replace(reg, function(match) {
							return '<a href="' + match + '" target="_blank">' + match + '</a>';
						});
						infos+=headers[no]+'：'+text;
					} else {
						infos+=headers[no]+'：'+csvArray[i][no];
					}
				}
			});
			no+=1;
			let id_value=toString(no);
			if(dataList[dataInfoIndex].id>=0) {
				id_value=csvArray[i][dataList[dataInfoIndex].id];
			}
			data.push({
				no:no,
				id:id_value,
				label:csvArray[i][dataList[dataInfoIndex].label],
				info:infos,
				lat:parseFloat(csvArray[i][dataList[dataInfoIndex].lat]),
				lng:parseFloat(csvArray[i][dataList[dataInfoIndex].lng]),
			});
		}
		return data;
	}
	function dataFromJson(readText, dataInfoIndex) {
		let data=[];
		let no=0
		let json=JSON.parse(readText);
		let reg=new RegExp("((https?|ftp)(:\/\/[-_.!~*\'()a-zA-Z0-9;\/?:\@&=+\$,%#]+))", 'g');
		for(i=0; i<json.length; i++) {
			let infos='';
			Object.keys(json[i]['info']).forEach(function(key) {
				if(infos!='') {
					infos+='<BR>';
				}
				if(json[i]['info'][key]['value']!='') {
					let text=json[i]['info'][key]['value'].replace(reg, function(match) {
						return '<a href="' + match + '" target="_blank">' + match + '</a>';
					});
					infos+=json[i]['info'][key]['key']+'：'+text;
				} else {
					infos+=json[i]['info'][key]['key']+'：'+json[i]['info'][key]['value'];
				}
			});
			no++;
			rec = {
				no:no,
				id:json[i]['id'],
				label:json[i]['label'],
				info:infos,
				lat:json[i]['lat'],
				lng:json[i]['lng'],
			};
			if('error' in json[i]) {
				rec.error=json[i]['error'];
			}
			data.push(rec);
		}
		return data;
	}
	function startTraceCurrentPosition() {
		if(DEBUG) console.log(dateToString(new Date())+' startTraceCurrentPosition() start');
		if(!myGeolocation) {
			var tag=document.getElementById("traceButton");
			if(tag!=null) {
				tag.value='追尾不可';
				tag.disabled=true;
			}
			if(DEBUG) console.log(dateToString(new Date())+' ※現在位置情報が取得できないブラウザです。');
			document.getElementById("message").innerHTML='※現在位置情報が取得できないブラウザです。';
			return;
		}
		buttonLabel='追尾停止';
		var gmapTag=document.getElementById("gmap");
		// 現在位置情報取得
		var position_options={
			enableHighAccuracy:true
		};
		myWatchID=navigator.geolocation.watchPosition(function(position) {
			if(DEBUG) console.log(dateToString(new Date())+' watchPosition() start');
			mapCenter=new google.maps.LatLng(position.coords.latitude, position.coords.longitude);
			if(DEBUG) console.log(dateToString(new Date())+' watchPosition, mapCenter='+mapCenter);
			if(mapCenter!=null) {
				map.setCenter(mapCenter);
				// 現在地マーカー表示
				if(myMarker==null) {
					myMarker=new google.maps.Marker({
						position:mapCenter,
						map:map,
						zIndex:0,
						title:'現在地',
						icon:'https://chart.googleapis.com/chart?chst=d_map_pin_letter&chld=・|4FFF00|000000'
					});
					dispInfo(myMarker, '現在地');
				} else {
					myMarker.position=mapCenter;
					myMarker.zIndex=0;
					myMarker.setMap(map);
				}
				var moveCenter=false;
				if(mapCenterPrev==null) {
					if(DEBUG) console.log(dateToString(new Date())+' センター設定：'+mapCenter);
					moveCenter=true;
				} else if(mapCenter.lat()!=mapCenterPrev.lat() || mapCenter.lng()!=mapCenterPrev.lng()) {
					if(DEBUG) console.log(dateToString(new Date())+' センター移動：'+mapCenter.lat()+':'+mapCenter.lng()+'←'+mapCenterPrev.lat()+':'+mapCenterPrev.lng());
					moveCenter=true;
				} else if(delMarkers) {
					moveCenter=true;
				}
				if(moveCenter) {
					// 表更新
					showTable();
					// マーカー再表示
					if(delMarkers || markMaxValue!=99999) {
						delMarkers=true;
						showMarkers();
					}
				}
				if(directionRouteNo>=0) {
					directionsRenderer.setMap(map);
				}
				mapCenterPrev=new google.maps.LatLng(mapCenter.lat(), mapCenter.lng());
			}
			if(DEBUG) console.log(dateToString(new Date())+' watchPosition() ended');
		}, function() {
			if(DEBUG) console.log(dateToString(new Date())+' start ※現在地が取得できません。');
			document.getElementById("message").innerHTML='※現在地が取得できません。';
		}, position_options);
		google.maps.event.addListener(map, "center_changed", function() {
			if(DEBUG) console.log(dateToString(new Date())+' center_changed.');
			// stopTraceCurrentPosition();
			showTable();
		});
		var tag=document.getElementById("traceButton");
		if(tag!=null) {
			tag.value=buttonLabel;
		}
		if(DEBUG) console.log(dateToString(new Date())+' startTraceCurrentPosition() ended');
	}
	function toggleTraceButton() {
		if(DEBUG) console.log(dateToString(new Date())+' toggleTraceButton() start');
		if(buttonLabel=='追尾停止') {
			stopTraceCurrentPosition();
		} else {
			startTraceCurrentPosition();
		}
		if(DEBUG) console.log(dateToString(new Date())+' toggleTraceButton() ended');
	}
	function stopTraceCurrentPosition() {
		if(DEBUG) console.log(dateToString(new Date())+' stopTraceCurrentPosition() start');
		navigator.geolocation.clearWatch(myWatchID);
		buttonLabel='追尾開始';
		var buttonTag=document.getElementById("traceButton");
		buttonTag.value=buttonLabel;
		if(DEBUG) console.log(dateToString(new Date())+' stopTraceCurrentPosition() ended');
	}
	function toggleShowLocation() {
		if(DEBUG) console.log(dateToString(new Date())+' toggleShowLocation() start');
		showTable();
		if(DEBUG) console.log(dateToString(new Date())+' toggleShowLocation() ended');
	}
	function dispInfo(marker, name) {
		if(DEBUG) console.log(dateToString(new Date())+' dispInfo() start, '+':'+name);
		google.maps.event.addListener(marker, 'click',
			function(event) {
				new google.maps.InfoWindow({content:name}).open(marker.getMap(), marker);
			}
		);
		if(DEBUG) console.log(dateToString(new Date())+' dispInfo() ended, '+':'+name);
	}
	function showMarkers() {
		if(DEBUG) console.log(dateToString(new Date())+' showMarkers() start, markMaxValue='+markMaxValue);
		if(delMarkers==true) {
			for(no=0;no<markers.length; no++) {
				markers[no].setMap(null);
			}
			delMarkers=false;
			markers=new Array();
		}
		if(markers.length==0) {
			for(no=0; no<data.length; no++) {
				markers.push(new google.maps.Marker({
						position: new google.maps.LatLng(data[no].lat, data[no].lng),
						map:map,
						title:data[no].label,
						icon:'https://chart.googleapis.com/chart?chst=d_map_pin_letter&chld='+data[no].no+'|FF4F4F|000000'
					}));
				dispInfo(markers[markers.length-1], data[no].label);
				if(no+1>=markMaxValue) {
					break;
				}
			}
		}
		if(DEBUG) console.log(dateToString(new Date())+' showMarkers() ended, markMaxValue='+markMaxValue);
	}
	function showTable() {
		if(DEBUG) console.log(dateToString(new Date())+' showTable() start');
		if(directionRouteNo>=0) {
			showTrabelRoute(directionRouteNo);
			directionRouteNo=-1;
		}
		var markTable=document.getElementById("markTableV");
		var showLocation=document.getElementById("showLocation");
		if(showLocation!=null) {
			showLocation=showLocation.checked;
		} else {
			showLocation=false;
		}
		// 現在地から近い順にソート
		for(no=0; no<data.length; no++) {
			if(data[no].lat=='' || data[no].lng=='') {
			    data[no].distance=NaN;
			} else {
				data[no].distance=distanceLatlng(data[no].lat,data[no].lng);
			}
		}
		data.sort(function(a, b) {
			if(isNaN(a.distance)) return 1;
			if(isNaN(b.distance)) return -1;
			return (a.distance < b.distance)?-1:1;
		});
		markTable.innerHTML="";
		markTable=document.getElementById("markTableH");
		markTable.innerHTML="";
		markTable=document.getElementById(markTableTag);
		var tableTags="";
		tableTags+='<table id="list" border="1">';
		tableTags+='<tbody>';
		tableTags+='<tr><th>No</th><th>名称</th><th nowrap>直線距離(m)</th>';
		if(showLocation) {
			tableTags+='<th>緯度</th><th>経度</th>';
		}
		tableTags+='</tr>';
		tableTags+='<tr onClick="showPopup(-1);"><td>現</td>'
				+'<td>現在地</td><td align="RIGHT">0</td>';
		if(showLocation) {
			tableTags+='<td>'+Math.round(mapCenter.lat()*1000000)/1000000+'</td><td>'+Math.round(mapCenter.lng()*1000000)/1000000+'</td>';
		}
		tableTags+='</tr>';
		for(no=0; no<data.length; no++) {
			tableTags+='<tr>'
						+'<td><input type="button" value="'+data[no].no+'" onClick="showTrabelRoute('+no+');"></td>'
						+'<td onClick="showPopup('+no+');">'+data[no].label+'</td>'
						+'<td align="RIGHT">'+data[no].distance.toLocaleString()+'</td>';
			if(showLocation) {
				tableTags+='<td>'+data[no].lat+'</td>'
						+'<td>'+data[no].lng+'</td>';
			}
			tableTags+='</tr>';
		}
		tableTags+='</tbody>';
		tableTags+='</table>';
		markTable.innerHTML=tableTags;
		markTable.scrollTop=0;
		if(DEBUG) console.log(dateToString(new Date())+' showTable() ended');
	}
	function showPopup(no) {
		if(DEBUG) console.log(dateToString(new Date())+' showPopup() start');
		var divTag=document.getElementById("locationDetail");
		var detail="";
		detail+='<table border="1" id="detailTable">\n';
		detail+='<tr><th>項目</th><th>値</th><tr>\n';
		if(no==-1) {
			detail+='<tr><td>名称</td><td>現在地</td></tr>\n';
			detail+='<tr><td>情報</td><td>現在地</td></tr>\n';
			detail+='<tr><td>緯度</td><td>'+mapCenter.lat()+'</td></tr>\n';
			detail+='<tr><td>経度</td><td>'+mapCenter.lng()+'</td></tr>\n';
		} else {
			detail+='<tr><td>名称</td><td>'+data[no].label+'</td></tr>\n';
			detail+='<tr><td>情報</td><td>'+data[no].info+'</td></tr>\n';
			detail+='<tr><td>緯度</td><td>'+data[no].lat+'</td></tr>\n';
			detail+='<tr><td>経度</td><td>'+data[no].lng+'</td></tr>\n';
			if('error' in data[no]) {
				detail+='<tr bgcolor="red"><td>msg</td><td>'+data[no].error+'</td></tr>\n';
			}
		}
		detail+='</table>\n';
		divTag.innerHTML=detail;
		divTag=document.getElementById("modalWindow");
		divTag.style.display="block";
		if(DEBUG) console.log(dateToString(new Date())+' showPopup() ended');

	function closePopup() {
		if(DEBUG) console.log(dateToString(new Date())+' closePopup() start');
		var divTag=document.getElementById("modalWindow");
		divTag.style.display="none";
		if(DEBUG) console.log(dateToString(new Date())+' closePopup() ended');
	}
	function myMarkToCenter() {
		if(DEBUG) console.log(dateToString(new Date())+' myMarkToCenter() start');
		map.setCenter(mapCenter);
		startTraceCurrentPosition();
		if(DEBUG) console.log(dateToString(new Date())+' myMarkToCenter() ended');
	}
	function markToCenter(no) {
		if(DEBUG) console.log(dateToString(new Date())+' markToCenter('+no+') start');
		stopTraceCurrentPosition();
		mapCenter=new google.maps.LatLng(data[no].lat, data[no].lng);
		map.setCenter(mapCenter);
		if(DEBUG) console.log(dateToString(new Date())+' markToCenter('+no+') ended');
	}
	function showTrabelRoute(no) {
		if(DEBUG) console.log(dateToString(new Date())+' showTrabelRoute('+no+') start');
		// stopTraceCurrentPosition();
		if(directionsService==null) {
			directionsService=new google.maps.DirectionsService();
			directionsRenderer=new google.maps.DirectionsRenderer();
		}
		if(directionRouteNo>=0) {
			directionsRenderer.setMap(null);
			if(directionRouteNo==no) {
				directionRouteNo=-1;
				no=-1;
			}
		}
		if(no>=0) {
			let request = {
				origin: mapCenter,	//スタート地点
				destination: new google.maps.LatLng(data[no].lat, data[no].lng),	//ゴール地点
				travelMode: google.maps.DirectionsTravelMode.WALKING	//移動手段
			};
			directionsService.route(request, function(result, status) {
				if (status == google.maps.DirectionsStatus.OK) {
					directionsRenderer.setOptions({
						preserveViewport: true //ズーム率を変更してルート全体を表示しない
					});
					// ルート検索の結果を地図上に描画
					directionsRenderer.setDirections(result);
					directionsRenderer.setMap(map);
				}
			});
			directionRouteNo=no;
		}
		if(DEBUG) console.log(dateToString(new Date())+' showTrabelRoute('+no+') ended');
	}
	function distanceLatlng(lat, lng) {
		return(Math.round(Math.sqrt(
					Math.pow((mapCenter.lat()-lat)*100000,2)
					+Math.pow((mapCenter.lng()-lng)*100000,2)
		)));
	}
	function resizeWindows() {
		if(DEBUG) console.log(dateToString(new Date())+' resizeWindows() start');
		var winW=parseInt(document.documentElement.clientWidth);
		var winH=parseInt(document.documentElement.clientHeight);
		var tag=document.getElementById('gmap');
		if(winW>winH) {
			markTableTag="markTableH";
			tag.style.width=((winW-20)/2)+'px';
			tag.style.height=(winH-110)+'px';
			document.getElementById('markTableH').style.height=(winH-110)+'px';
			document.getElementById('markTableH').style.overflow='auto';
			document.getElementById('markTableV').style.height=0;
			document.getElementById('markTableV').style.overflow='hidden';
		} else {
			markTableTag="markTableV";
			tag.style.width=(winW-55)+'px';
			tag.style.height=(winH-(110+120+10))+'px';
			document.getElementById('markTableH').style.height=tag.style.height;
			document.getElementById('markTableH').style.overflow='hidden';
			document.getElementById('markTableV').style.height=(32*3)+'px';
			document.getElementById('markTableV').style.overflow='auto';
		}
		if(DEBUG) console.log(dateToString(new Date())+' resizeWindows() ended');
	}
	function dateToString(date) {
		return([date.getFullYear(),('0'+date.getMonth()+1).slice(-2),('0'+date.getDate()).slice(-2)].join('/')
			+' '
			+[('0'+date.getDate()).slice(-2),('0'+date.getMinutes()).slice(-2),('0'+date.getSeconds()).slice(-2)].join(':')
		);
	}
	if(DEBUG) console.log(dateToString(new Date())+' javascript passed');
	</script>
