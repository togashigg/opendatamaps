server {
    server_name     localhost;
    server_name     127.0.0.1;
    listen          80;

    proxy_set_header    Host    $host;
    proxy_set_header    X-Real-IP   $remote_addr;
    proxy_set_header    X-Forwarded-Host   $host;
    proxy_set_header    X-Forwarded-Server $host;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root    /usr/share/nginx/html;
    }
    location /.well-known/acme-challenge/ {
        # root    /usr/share/nginx/html;
        root    /var/www/html;
    }

    location /static/ {
        root    /usr/share/nginx/html;
    }
    location /opendatamaps/ {
        proxy_pass       http://opendatamaps:8080/;
        proxy_set_header X-Script-Name /opendatamaps;
        proxy_redirect   off;
    }

}

server {
    server_name     localhost;
    server_name     127.0.0.1;
    listen          443 ssl;
    http2           on;

    ssl_certificate      /etc/openssl/server.crt;
    ssl_certificate_key  /etc/openssl/server.key;
    ssl_password_file    /etc/openssl/passwd;
    ssl_session_timeout  10m;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256'
;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=2592000" always;

    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-Host   $host;
    proxy_set_header    X-Forwarded-Server $host;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root    /usr/share/nginx/html;
    }
    location /.well-known/acme-challenge/ {
        # root    /usr/share/nginx/html;
        root    /var/www/html;
    }

    location /static/ {
        root    /usr/share/nginx/html;
    }
    location /opendatamaps/ {
        proxy_pass       http://opendatamaps:8080/;
        proxy_set_header X-Script-Name /opendatamaps;
        proxy_redirect   off;
    }

}

