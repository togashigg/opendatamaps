version: "3"

networks:
  compose-net:
    driver: bridge

services:

  nginx:
    depends_on:
      - opendatamaps
    image: nginx
    networks:
      - compose-net
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/html:/etc/nginx/html
      - ./nginx/openssl:/etc/openssl
    command: [nginx-debug, '-g', 'daemon off;']

  opendatamaps:
    depends_on:
      - db
    image: opendatamaps
    networks:
      - compose-net
    volumes:
      # - ./opendatamaps/crawler.json:/app/src/crawler.json:ro
      - ./opendatamaps/download:/app/download
      - ./opendatamaps/cache:/app/cache
      - ./opendatamaps/djangoapp_log:/app/djangoapp/log
      - ./opendatamaps/cmd_log:/app/log
    environment:
      - GOOGLE_MAPS_API_KEY
      - POSTGRESQL_HOST
      - POSTGRESQL_PORT
      - POSTGRESQL_DBNAME
      - POSTGRESQL_USER
      - POSTGRESQL_PASS

  db:
    # image: postgres:18.1
    image: db
    build:
      context: ./db/build
      dockerfile: Dockerfile
    networks:
      - compose-net
    ports:
      - "5432:5432"
    environment:
      - TZ=Asia/Tokyo
      - PGTZ=Asia/Tokyo
      - POSTGRES_DB=$POSTGRESQL_DBNAME
      - POSTGRES_USER=$POSTGRESQL_USER
      - POSTGRES_PASSWORD=$POSTGRESQL_PASS
      - POSTGRES_INITDB_ARGS="--encoding=UTF8"
      # V<18 - PGDATA=./db/data
    volumes:
      # V<18 - ./db/data:/var/lib/postgresql/data
      - ./db/data/18:/var/lib/postgresql/18/docker

